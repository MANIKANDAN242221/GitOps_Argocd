# Alert rules for the monitoring stack.
# kube-prometheus-stack itself is installed by Terraform (modules/monitoring-bootstrap);
# Argo CD only syncs the PrometheusRules in monitoring/alerts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/my-org/gitops-manifests.git # CHANGE ME
    targetRevision: main
    path: monitoring/alerts

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring # created by Terraform

  revisionHistoryLimit: 10

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
