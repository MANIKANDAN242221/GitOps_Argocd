# Sensitive backend settings, loaded into the container as env vars (envFrom).
#
# Everything in Git is readable by everyone with repo access. The value below is
# a placeholder: overlays/prod deletes this Secret, and the real one is created
# outside Git (External Secrets Operator + AWS Secrets Manager, Sealed Secrets,
# or kubectl create secret generic backend-secret ...).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
  # No hash suffix on purpose: prod's external Secret must keep this exact name.
  # After changing a secret value: kubectl -n platform-demo rollout restart deploy/backend
type: Opaque
stringData:
  API_KEY: change-me-not-a-real-secret
