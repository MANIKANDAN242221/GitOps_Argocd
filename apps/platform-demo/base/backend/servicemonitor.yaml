# Scrapes the backend's /metrics. Prometheus picks up ServiceMonitors from every
# namespace (serviceMonitorSelectorNilUsesHelmValues = false in Terraform), so no release label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
  annotations:
    # The CRD may not exist yet on a fresh cluster; let the sync retry instead of failing dry-run.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
