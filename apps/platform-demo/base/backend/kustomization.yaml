apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - servicemonitor.yaml

# ConfigMap "backend-config": non-sensitive settings, loaded as env vars (envFrom).
# Kustomize appends a content hash to the name (backend-config-<hash>) and updates
# the Deployment to match, so changing a value rolls the pods.
# Overlays merge their own values in (behavior: merge).
configMapGenerator:
  - name: backend-config
    literals:
      - APP_ENV=base
      - LOG_LEVEL=info
