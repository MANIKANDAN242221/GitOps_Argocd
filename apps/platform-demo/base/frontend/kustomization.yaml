apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# ConfigMap "frontend-config", loaded as env vars. Name gets a content hash,
# so changing a value rolls the pods.
configMapGenerator:
  - name: frontend-config
    literals:
      - BACKEND_URL=http://backend:3000 # read by nginx's envsubst at startup
