apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
labels:
- pairs:
    environment: dev
configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=dev
  - LOG_LEVEL=debug
  name: backend-config
  # Pod count is set on the HPAs, not the Deployments.
patches:
- patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 3
  target:
    kind: HorizontalPodAutoscaler
# ECR tags are immutable. CI pushes a new tag, then bumps newTag here:
#   kustomize edit set image backend=<registry>/dev/backend:<tag>
images:
- name: backend
  newName: 772721871682.dkr.ecr.ap-south-1.amazonaws.com/dev/backend
  newTag: 12264cf
- name: frontend
  newName: 772721871682.dkr.ecr.ap-south-1.amazonaws.com/dev/frontend
  newTag: 12264cf
