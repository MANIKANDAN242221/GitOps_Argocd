# Internet-facing ALB for the dev apps (needs the AWS Load Balancer Controller).
# All ingresses with group.name "dev-external" share ONE ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-dev-ingress
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: "dev-external"
    alb.ingress.kubernetes.io/group.order: '1'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1200
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # --- HTTPS: once you have a domain + ACM certificate in ap-south-1 ---
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:772721871682:certificate/<id>
    # external-dns.alpha.kubernetes.io/hostname: app-dev.<your-domain>
spec:
  ingressClassName: alb
  # tls:
  #   - hosts:
  #       - app-dev.<your-domain>
  rules:
    - http: # add "host: app-dev.<your-domain>" here once DNS exists
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: gitops-backend-dev
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-frontend-dev
                port:
                  number: 80
