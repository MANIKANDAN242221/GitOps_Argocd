# Default values for every environment. values-dev.yaml / values-prod.yaml
# override only what differs (Helm deep-merges maps; lists are replaced whole).

global:
  environment: base # written into each ConfigMap as APP_ENV

components:
  # ===========================================================================
  # backend: Express API on :3000 (/healthz, /readyz, /metrics, /api/*)
  # ===========================================================================
  backend:
    enabled: true
    component: api

    image:
      repository: 111122223333.dkr.ecr.us-east-1.amazonaws.com/dev/backend # CHANGE ME: account ID
      tag: "" # empty = Chart.appVersion; CI sets an immutable tag per env
      pullPolicy: IfNotPresent

    containerPort: 3000

    # --- Deployment / rolling update -----------------------------------------
    replicaCount: 2 # used only when autoscaling.enabled = false
    revisionHistoryLimit: 5
    minReadySeconds: 5
    progressDeadlineSeconds: 300
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired count during a rollout
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5

    # --- Env vars ------------------------------------------------------------
    env:
      - name: PORT
        value: "3000"
    config: # -> ConfigMap backend-config (non-sensitive)
      LOG_LEVEL: info
    secrets: {} # -> Secret backend-secret (dev/demo only, see templates/secret.yaml)
    existingSecret: "" # name of a Secret created outside Git; wins over `secrets`

    # --- Probes --------------------------------------------------------------
    readinessProbe: # gates traffic and the rolling update
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 3
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe: # restarts a hung container
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000 # "node" user in node:22-alpine
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

    podAnnotations: {}
    volumes: []
    volumeMounts: []

    # --- Service -------------------------------------------------------------
    service:
      type: ClusterIP
      port: 3000 # frontend nginx proxies /api/ to http://backend:3000

    # --- Ingress (backend is internal only) ----------------------------------
    ingress:
      enabled: false

    # --- HPA -----------------------------------------------------------------
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: null

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    serviceMonitor:
      enabled: true
      path: /metrics
      interval: 30s

  # ===========================================================================
  # frontend: React build on nginx-unprivileged (uid 101), :8080
  # The only public entry point; nginx proxies /api/ to the backend.
  # ===========================================================================
  frontend:
    enabled: true
    component: web

    image:
      repository: 111122223333.dkr.ecr.us-east-1.amazonaws.com/dev/frontend # CHANGE ME: account ID
      tag: ""
      pullPolicy: IfNotPresent

    containerPort: 8080

    replicaCount: 2
    revisionHistoryLimit: 5
    minReadySeconds: 5
    progressDeadlineSeconds: 300
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5

    env: []
    config:
      BACKEND_URL: http://backend:3000 # read by nginx's envsubst at startup
    secrets: {}
    existingSecret: ""

    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 2
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 20
      failureThreshold: 3

    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

    podAnnotations: {}
    # nginx needs writable paths with a read-only root filesystem.
    # conf.d is where the image renders nginx.conf from its template.
    volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-conf
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-conf
        mountPath: /etc/nginx/conf.d

    service:
      type: ClusterIP
      port: 80

    # Internet-facing ALB from the AWS Load Balancer Controller.
    # target-type ip sends traffic straight to pod IPs (vpc-cni).
    ingress:
      enabled: true
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
        alb.ingress.kubernetes.io/healthcheck-path: /healthz
        alb.ingress.kubernetes.io/success-codes: "200"
      hosts:
        - host: "" # empty = match any host (ALB DNS name)
          paths:
            - path: /
              pathType: Prefix
      tls: [] # ALB terminates TLS with ACM (annotation), so no tls block

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: null

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    serviceMonitor:
      enabled: false # nginx has no /metrics
