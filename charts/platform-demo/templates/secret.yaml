{{- /*
Sensitive settings, loaded into the container as env vars (envFrom).

Anything in this repo is readable by everyone with Git access, so only use
`secrets:` for dev/demo values. For real environments set `existingSecret`
to a Secret created outside Git (External Secrets Operator + AWS Secrets
Manager, Sealed Secrets, or kubectl) and leave `secrets:` empty; then this
template renders nothing.
*/}}
{{- range $name, $c := .Values.components }}
{{- if and $c.enabled $c.secrets (not $c.existingSecret) }}
{{- $ctx := dict "root" $ "name" $name "c" $c }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  labels:
    {{- include "platform-demo.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $c.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
